<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Catalogo completo de productos - FJ Shop">
    <title>Catalogo | FJ Shop</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome (iconos) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="../CSS/styles.css">
</head>
<body>

    <!-- ===== Header / Barra de navegacion ===== -->
    <header class="site-header">
        <nav class="navbar navbar-expand-lg navbar-dark" aria-label="Navegacion principal">
            <div class="container">

                <a class="navbar-brand" href="index.html" id="brandLogo">
                    <i class="fa-solid fa-bag-shopping" aria-hidden="true"></i>
                    <span data-i18n="brand">FJ Shop</span>
                </a>

                <!-- Buscador -->
                <div class="search-wrapper order-lg-2" role="search">
                    <i class="fa-solid fa-magnifying-glass search-icon" aria-hidden="true"></i>
                    <input
                        type="search"
                        class="form-control search-input"
                        id="searchInput"
                        placeholder="Buscar productos..."
                        data-i18n-placeholder="searchPlaceholder"
                        aria-label="Buscar productos por nombre"
                        autocomplete="off"
                    >
                </div>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
                        aria-controls="navMenu" aria-expanded="false" aria-label="Alternar menu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse order-lg-3" id="navMenu">
                    <ul class="navbar-nav ms-auto align-items-lg-center">
                        <!-- Enlace al index -->
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">
                                <i class="fa-solid fa-house" aria-hidden="true"></i> <span data-i18n="inicio">Inicio</span>
                            </a>
                        </li>
                        <!-- Selector de idioma -->
                        <li class="nav-item lang-toggle">
                            <div class="dropdown">
                                <button type="button" class="btn lang-btn dropdown-toggle" id="langDropdownBtn"
                                        data-bs-toggle="dropdown" aria-expanded="false" aria-label="Seleccionar idioma">
                                    <i class="fa-solid fa-globe" aria-hidden="true"></i>
                                    <span id="langCurrent">ES</span>
                                </button>
                                <ul class="dropdown-menu dropdown-menu-end lang-menu">
                                    <li><button type="button" class="dropdown-item lang-option" data-lang="es">Español</button></li>
                                    <li><button type="button" class="dropdown-item lang-option" data-lang="en">English</button></li>
                                </ul>
                            </div>
                        </li>
                        <!-- Boton carrito -->
                        <li class="nav-item">
                            <button type="button" class="btn btn-cart position-relative" id="cartBtn"
                                    aria-label="Abrir carrito de compras">
                                <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i>
                                <span class="badge rounded-pill cart-badge" id="cartBadge" hidden>0</span>
                            </button>
                        </li>
                    </ul>
                </div>

            </div>
        </nav>

        <!-- Navegacion por categorias -->
        <nav class="category-nav" aria-label="Navegacion por categorias">
            <div class="container categories-container" id="categoriesContainer">
                <!-- Las categorias se generan dinamicamente desde JS -->
            </div>
        </nav>
    </header>

    <main class="main-content">
        <div class="container">

            <!-- Titulo de la seccion de catalogo -->
            <section class="section-header" aria-labelledby="catalogTitle">
                <h2 class="section-title" id="catalogTitle" data-i18n="catalogTitle">Catalogo de Productos</h2>
                <p class="section-subtitle" id="catalogCount"></p>
            </section>

            <!-- Barra de herramientas: filtros y ordenamiento -->
            <section class="catalog-toolbar" aria-label="Filtros y ordenamiento">
                <div class="toolbar-group">
                    <label for="sortSelect" class="toolbar-label" data-i18n="sortBy">Ordenar por:</label>
                    <select class="form-select toolbar-select" id="sortSelect" aria-label="Ordenar productos">
                        <option value="default" selected data-i18n="sortDefault">Por defecto</option>
                        <option value="price-asc" data-i18n="sortPriceAsc">Precio: menor a mayor</option>
                        <option value="price-desc" data-i18n="sortPriceDesc">Precio: mayor a menor</option>
                        <option value="name-asc" data-i18n="sortNameAsc">Nombre: A - Z</option>
                        <option value="name-desc" data-i18n="sortNameDesc">Nombre: Z - A</option>
                    </select>
                </div>
            </section>

            <!-- Grilla de productos -->
            <section class="products-grid" id="productsGrid" aria-label="Listado de productos">
                <!-- Las cards de productos se generan dinamicamente desde JS -->
            </section>

            <!-- Mensaje de vacio / carga -->
            <div class="products-state" id="productsState">
                <i class="fa-solid fa-spinner fa-spin-pulse state-icon" aria-hidden="true"></i>
                <p class="state-text" id="productsStateText">Cargando productos...</p>
            </div>

            <!-- Paginacion -->
            <nav class="catalog-pagination" id="catalogPagination" aria-label="Paginacion del catalogo" hidden>
                <button type="button" class="btn pagination-btn" id="prevPageBtn" disabled aria-label="Pagina anterior">
                    <i class="fa-solid fa-chevron-left" aria-hidden="true"></i> Anterior
                </button>
                <span class="pagination-info" id="paginationInfo">Pagina 1 de 1</span>
                <button type="button" class="btn pagination-btn" id="nextPageBtn" disabled aria-label="Pagina siguiente">
                    Siguiente <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
                </button>
            </nav>

        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; <span id="year"></span> FJ Shop. <span data-i18n="footerText">Todos los derechos reservados.</span></p>
        </div>
    </footer>

    <!-- ===== Modal de detalle de producto ===== -->
    <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content product-modal">
                <div class="modal-header">
                    <h5 class="modal-title" id="productModalTitle"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-4 align-items-center">
                        <div class="col-md-5">
                            <img src="" alt="Imagen del producto" class="modal-img" id="modalImage">
                        </div>
                        <div class="col-md-7">
                            <span class="product-price" id="modalPrice"></span>
                            <p class="product-desc" id="modalDescription"></p>
                            <p class="product-name" id="modalName"></p>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" data-i18n="close">Cerrar</button>
                    <button type="button" class="btn btn-primary btn-add-cart" id="modalAddCart" data-i18n="addToCart">Agregar al carrito</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== Sidebar / Carrito lateral ===== -->
    <aside class="cart-sidebar" id="cartSidebar" aria-label="Carrito de compras" aria-hidden="true">
        <div class="cart-sidebar-header">
            <h2 class="cart-title" data-i18n="cartTitle"><i class="fa-solid fa-cart-shopping" aria-hidden="true"></i> Tu Carrito</h2>
            <button type="button" class="btn-close" id="cartCloseBtn" aria-label="Cerrar carrito"></button>
        </div>

        <div class="cart-items" id="cartItems">
            <!-- Los items del carrito se generan dinamicamente desde JS -->
        </div>

        <div class="cart-empty" id="cartEmpty">
            <i class="fa-solid fa-cart-arrow-down empty-cart-icon" aria-hidden="true"></i>
            <p data-i18n="cartEmpty">Tu carrito esta vacio.</p>
        </div>

        <div class="cart-sidebar-footer" id="cartFooter" hidden>
            <div class="cart-total">
                <span data-i18n="cartTotalDisplay">Total: </span>
                <strong id="cartTotalPrice">$0.00</strong>
            </div>
            <button type="button" class="btn btn-outline-danger w-100 mb-2" id="cartClearBtn" data-i18n="clearAll">Eliminar todos</button>
            <button type="button" class="btn btn-primary btn-checkout w-100" id="cartCheckoutBtn" data-i18n="checkout">Finalizar compra</button>
        </div>
    </aside>
    <div class="cart-overlay" id="cartOverlay" hidden></div>

    <!-- ===== Librerias externas ===== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Script de internacionalizacion compartido -->
    <script src="../JS/i18n.js"></script>
    <!-- Script principal del catalogo -->
    <script src="../JS/catalogo.js"></script>
</body>
</html>
